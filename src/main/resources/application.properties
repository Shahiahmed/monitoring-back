spring.application.name=monitoring

spring.datasource.url=jdbc:postgresql://localhost:5432/monitoring
spring.datasource.username=postgres
spring.datasource.password=Blacklotus01
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: работать только с public схемой
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true


management.endpoint.health.show-details=always


server.port=8081
server.error.whitelabel.enabled=false

# JWT (HS256): секрет не короче 32 символов; в проде задайте через переменную окружения
monitoring.jwt.secret=${MONITORING_JWT_SECRET:dev-change-me-use-env-in-production-32chars!!}
monitoring.jwt.expiration-ms=86400000

# SSH для получения метрик с серверов (CPU, память, диск)
monitoring.ssh.user=monitoringapp
monitoring.ssh.password=Qwerty123
monitoring.ssh.port=22
monitoring.ssh.timeout-seconds=10
monitoring.ssh.cache-seconds=60
